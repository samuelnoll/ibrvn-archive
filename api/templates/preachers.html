{% extends "base.html" %}

{% block content %}

<section class="list-page">

<div class="list-page-header">
<h2>Pregadores</h2>
<p>Veja os pregadores cadastrados e acesse todas as mensagens de cada um em um clique.</p>
</div>

<div class="entity-list">

{% for p in preachers %}

<a class="entity-card" href="/preachers/{{ p.preacher_name }}">
<div class="entity-card-kicker">Pregador</div>
<div class="entity-card-title">{{ p.preacher_name }}</div>
<div class="entity-card-meta">{{ p.n }} pregacoes</div>
</a>

{% endfor %}

</div>

</section>

{% endblock %}
