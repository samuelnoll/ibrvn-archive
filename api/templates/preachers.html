{% extends "base.html" %}

{% block content %}

<section class="list-page">
<h2>Pregadores</h2>

<ul class="simple-card-list">
{% for p in preachers %}
<li class="simple-card-item">
<a class="simple-card-link" href="/preachers/{{ p.preacher_name | urlencode }}">
<span class="simple-card-title">{{ p.preacher_name }}</span>
<span class="simple-card-count">{{ p.n }} pregacoes</span>
</a>
</li>
{% endfor %}
</ul>
</section>

{% endblock %}
