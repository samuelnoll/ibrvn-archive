{% extends "base.html" %}

{% block content %}

<section class="list-page">

<div class="list-page-header">
<h2>Livros da Biblia</h2>
<p>Explore as pregacoes organizadas por livro e veja quantas mensagens temos em cada um.</p>
</div>

<div class="entity-list">

{% for b in books %}

<a class="entity-card" href="/books/{{ b.book }}">
<div class="entity-card-kicker">Livro</div>
<div class="entity-card-title">{{ b.book }}</div>
<div class="entity-card-meta">{{ b.n }} pregacoes</div>
</a>

{% endfor %}

</div>

</section>

{% endblock %}
