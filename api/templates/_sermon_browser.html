<div class="search-field">
<svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
<input class="search-input" id="search" type="search" placeholder="Buscar por t&iacute;tulo, texto b&iacute;blico ou pregador..." autocomplete="off" aria-label="Buscar prega&ccedil;&otilde;es">
</div>

<div class="section-heading">
<h2 id="sermon-list-title">Prega&ccedil;&otilde;es recentes</h2>
<span id="sermon-list-context">Ordenadas por data</span>
</div>

<div id="results" aria-live="polite"></div>

<div id="initial-sermons">
{% for s in sermons %}
{{ sermon_card(s) }}
{% endfor %}
</div>

<script>
const input = document.getElementById("search")
const results = document.getElementById("results")
const initial = document.getElementById("initial-sermons")
const listTitle = document.getElementById("sermon-list-title")
const listContext = document.getElementById("sermon-list-context")
let activeRequest

const escapeHTML = value => String(value ?? "").replace(/[&<>'"]/g, character => ({
  "&": "&amp;",
  "<": "&lt;",
  ">": "&gt;",
  "'": "&#39;",
  '"': "&quot;"
})[character])

const icon = name => `<svg class="icon" aria-hidden="true"><use href="#icon-${name}"></use></svg>`

const fact = (name, content, href) => {
  const inner = `${icon(name)}<span>${escapeHTML(content)}</span>`
  return href
    ? `<a class="sermon-fact" href="${href}">${inner}</a>`
    : `<span class="sermon-fact">${inner}</span>`
}

const action = (name, label, href) => href
  ? `<a href="${escapeHTML(href)}">${icon(name)}<span>${label}</span></a>`
  : ""

const renderSermon = sermon => {
  const hasTitle = Boolean(sermon.title)
  const title = sermon.title || sermon.text_reference || `Prega\u00e7\u00e3o de ${sermon.preaching_date || "data n\u00e3o informada"}`
  const facts = []
  const actions = []

  if (hasTitle && sermon.text_reference) {
    const book = encodeURIComponent(sermon.book_name)
    facts.push(fact("book-open", sermon.text_reference, `/books/${book}`))
  }

  if (sermon.preacher_name) {
    facts.push(fact("user", sermon.preacher_name, `/preachers/${encodeURIComponent(sermon.preacher_name)}`))
  }

  if (sermon.serie) {
    const seriesPath = sermon.preacher_name
      ? `/series/${encodeURIComponent(sermon.serie)}/preachers/${encodeURIComponent(sermon.preacher_name)}`
      : `/series/${encodeURIComponent(sermon.serie)}`
    facts.push(fact("library", `S\u00e9rie ${sermon.serie}`, seriesPath))
  }

  if (sermon.duration_minutes) facts.push(fact("clock", sermon.duration_minutes))

  actions.push(action("headphones", "&Aacute;udio", sermon.media_link))
  actions.push(action("download", "Arquivo", sermon.download_link))
  actions.push(action("youtube", "YouTube", sermon.youtube_link))
  actions.push(action("external-link", "P&aacute;gina", sermon.wordpress_link))
  if (sermon.transcript_available) {
    actions.push(action("file-text", "Transcri&ccedil;&atilde;o", `/transcripts/${encodeURIComponent(sermon.canonical_sermon_id)}`))
  }

  const availableActions = actions.join("")
  const audioPlayer = sermon.download_link
    ? `<div class="sermon-player" data-audio-player>
        <audio preload="metadata" src="${escapeHTML(sermon.download_link)}"></audio>
        <button class="sermon-player-toggle" type="button" aria-label="Reproduzir \u00e1udio">${icon("play")}</button>
        <input class="sermon-player-progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Posi\u00e7\u00e3o do \u00e1udio">
        <div class="sermon-player-details">
          <span class="sermon-player-time">0:00 / --:--</span>
          <button class="sermon-player-mute" type="button" aria-label="Silenciar \u00e1udio">${icon("volume")}</button>
          <input class="sermon-player-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        </div>
      </div>`
    : ""

  return `
    <article class="sermon-card">
      <time class="sermon-date">${escapeHTML(sermon.preaching_date)}</time>
      <h3 class="sermon-title">${escapeHTML(title)}</h3>
      <div class="sermon-facts">${facts.join("")}</div>
      ${audioPlayer}
      ${availableActions ? `<div class="sermon-actions">${availableActions}</div>` : ""}
    </article>`
}

input.addEventListener("input", async () => {
  const query = input.value.trim()

  if (activeRequest) activeRequest.abort()

  if (query.length < 2) {
    results.innerHTML = ""
    initial.hidden = false
    listTitle.textContent = "Prega\u00e7\u00f5es recentes"
    listContext.textContent = "Ordenadas por data"
    return
  }

  activeRequest = new AbortController()

  try {
    const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`, {
      signal: activeRequest.signal
    })
    const data = await response.json()

    initial.hidden = true
    listTitle.textContent = "Resultados da busca"
    listContext.textContent = `${data.length} resultado${data.length === 1 ? "" : "s"}`
    results.innerHTML = data.length
      ? data.map(renderSermon).join("")
      : '<p class="empty-state">Nenhuma prega&ccedil;&atilde;o encontrada.</p>'
  } catch (error) {
    if (error.name !== "AbortError") {
      results.innerHTML = '<p class="empty-state">N&atilde;o foi poss&iacute;vel realizar a busca.</p>'
    }
  }
})
</script>
