{% extends "base.html" %}

{% block content %}

<section class="list-page">

<div class="list-page-header">
<h2>Series</h2>
<p>Navegue pelas series completas e encontre rapidamente todas as mensagens relacionadas.</p>
</div>

<div class="entity-list">

{% for s in series %}

<a class="entity-card" href="/series/{{ s.serie }}">
<div class="entity-card-kicker">Serie</div>
<div class="entity-card-title">{{ s.serie }}</div>
<div class="entity-card-meta">{{ s.n }} pregacoes</div>
</a>

{% endfor %}

</div>

</section>

{% endblock %}
